name: 📰 每日科技简报

on:
  schedule:
    # 每天早上8点（UTC+8为下午4点UTC）执行
    # 如需改时间，修改此处的时间
    - cron: '0 0 * * *'  # UTC 00:00，即北京时间 08:00

  # 允许手动触发
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    name: 生成并推送每日科技简报

    steps:
      # 1. 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置Python环境
      - name: 🐍 设置Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 安装依赖（如需要）
      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 如果需要额外的包，在这里添加
          # pip install requests beautifulsoup4

      # 4. 运行简报生成脚本
      - name: 🚀 生成并推送简报
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 daily_briefing.py

      # 5. 提交更新的历史记录
      - name: 💾 提交历史记录更新
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 检查是否有改动
          if git diff --quiet briefing_history.json; then
            echo "无新改动，跳过提交"
          else
            git add briefing_history.json
            git commit -m "chore: 更新简报历史记录 ($(date +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref }}
          fi

      # 6. 失败时通知
      - name: ⚠️ 推送失败时的处理
        if: failure()
        run: |
          echo "❌ 简报生成或推送失败"
          if [ -f last_failed.md ]; then
            echo "已保存失败内容到 last_failed.md"
            cat last_failed.md
          fi

      # 7. 成功时输出摘要
      - name: 📊 生成执行摘要
        if: success()
        run: |
          echo "✅ 简报已成功生成并推送"
          echo "📅 执行时间: $(date '+%Y-%m-%d %H:%M:%S')"
          if [ -f briefing_history.json ]; then
            echo "📝 历史记录已更新"
          fi
